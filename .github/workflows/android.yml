name: Android-CI

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Android-CI
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
      - name: Build Android-targeted Newt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(gh api repos/fosrl/newt/releases/latest --jq '.tag_name')"
          test -n "$TAG"
          test "$TAG" != "null"
          git clone --depth 1 --branch "$TAG" https://github.com/fosrl/newt.git "${RUNNER_TEMP}/newt"
          python3 scripts/patch-newt-android-dns.py "${RUNNER_TEMP}/newt"
          (
            cd "${RUNNER_TEMP}/newt"
            gofmt -w websocket/client.go websocket/config.go util/util.go
            go test ./websocket ./util
          )
          mkdir -p app/src/main/jniLibs/arm64-v8a
          (
            cd "${RUNNER_TEMP}/newt"
            CGO_ENABLED=0 GOOS=android GOARCH=arm64 go build -trimpath -ldflags="-s -w" -o "$GITHUB_WORKSPACE/app/src/main/jniLibs/arm64-v8a/libnewt.so" .
          )
          chmod 0755 app/src/main/jniLibs/arm64-v8a/libnewt.so
          file app/src/main/jniLibs/arm64-v8a/libnewt.so
          echo "$TAG" > newt-version.txt
          sha256sum app/src/main/jniLibs/arm64-v8a/libnewt.so > newt-binaries.sha256
      - name: Assemble
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: newt-html-hoster-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            newt-version.txt
            newt-binaries.sha256
          if-no-files-found: error
          retention-days: 14
