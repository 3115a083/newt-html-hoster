name: Android CI

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Fetch official Newt release binaries
        shell: bash
        run: |
          set -euo pipefail
          TAG="$(curl -fsSL https://api.github.com/repos/fosrl/newt/releases/latest | jq -r .tag_name)"
          test -n "$TAG"
          test "$TAG" != "null"
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          curl --proto '=https' --tlsv1.2 -fL             "https://github.com/fosrl/newt/releases/download/$TAG/newt_linux_arm64"             -o app/src/main/jniLibs/arm64-v8a/libnewt.so
          curl --proto '=https' --tlsv1.2 -fL             "https://github.com/fosrl/newt/releases/download/$TAG/newt_linux_amd64"             -o app/src/main/jniLibs/x86_64/libnewt.so
          chmod 0755 app/src/main/jniLibs/*/libnewt.so
          printf '%s
' "$TAG" > newt-version.txt
          sha256sum app/src/main/jniLibs/*/libnewt.so | tee newt-binaries.sha256

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Verify APK exists
        run: test -s app/build/outputs/apk/debug/app-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: newt-html-hoster-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            newt-version.txt
            newt-binaries.sha256
          if-no-files-found: error
          retention-days: 14
