name: Android-CI

"on":
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"
      - name: Fetch Newt
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="$(gh api repos/fosrl/newt/releases/latest --jq '.tag_name')"
          test -n "$TAG"
          test "$TAG" != "null"
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/x86_64
          BASE="https://github.com/fosrl/newt/releases/download/$TAG"
          curl --retry 5 --retry-all-errors --connect-timeout 15 --proto '=https' --tlsv1.2 -fL "$BASE/newt_linux_arm64" -o app/src/main/jniLibs/arm64-v8a/libnewt.so
          curl --retry 5 --retry-all-errors --connect-timeout 15 --proto '=https' --tlsv1.2 -fL "$BASE/newt_linux_amd64" -o app/src/main/jniLibs/x86_64/libnewt.so
          chmod 0755 app/src/main/jniLibs/arm64-v8a/libnewt.so app/src/main/jniLibs/x86_64/libnewt.so
          app/src/main/jniLibs/x86_64/libnewt.so --version
          echo "$TAG" > newt-version.txt
          sha256sum app/src/main/jniLibs/arm64-v8a/libnewt.so app/src/main/jniLibs/x86_64/libnewt.so > newt-binaries.sha256
      - name: Assemble
        run: gradle --no-daemon :app:assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: newt-html-hoster-debug
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            newt-version.txt
            newt-binaries.sha256
          if-no-files-found: error
          retention-days: 14
